<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اليوم الثالث - صناعة المحتوى بالذكاء الاصطناعي</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="icon" type="image/png" href="../assets/img/haydar-logo.png">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.orn{position:fixed;border-radius:50%;pointer-events:none}
.orn.o1{width:340px;height:340px;border:1.5px solid var(--line);top:-120px;left:-120px;opacity:.55}
.orn.o2{width:220px;height:220px;border:1.5px dashed var(--line);bottom:-70px;right:-70px;opacity:.5}
.box{text-align:center;padding:40px 24px;position:relative;z-index:1}
.num{width:96px;height:96px;border-radius:50%;background:var(--green);color:var(--cream);font-weight:800;font-size:46px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pulse-ring 2.4s 1s infinite}
h1{font-family:'Sakkal Saad Poster';font-weight:400;font-size:64px;color:var(--green);line-height:1.2}
.soon{display:inline-block;margin-top:18px;background:var(--orange-soft);color:var(--orange);font-weight:800;font-size:24px;border-radius:100px;padding:10px 36px;border:1.5px dashed var(--orange)}
p{margin-top:16px;font-size:21px;color:var(--body)}
.back{display:inline-flex;align-items:center;gap:10px;margin-top:34px;color:var(--cream);background:var(--green);text-decoration:none;font-weight:700;font-size:20px;border-radius:100px;padding:12px 34px;transition:transform .25s ease}
.back:hover{transform:translateY(-3px)}
</style>
</head>
<body>
<div class="orn o1"></div><div class="orn o2"></div>
<div class="box">
  <div class="num a" style="--d:.1s">٣</div>
  <h1 class="a" style="--d:.2s">اليوم الثالث</h1>
  <div class="a" style="--d:.35s"><span class="soon">قريباً ✦ السلايدات قيد الإعداد</span></div>
  <p class="a" style="--d:.5s">دورة صناعة المحتوى بالذكاء الاصطناعي - Content Creation Using AI</p>
  <a class="back a" style="--d:.65s" href="../">العودة للصفحة الرئيسية</a>
</div>
</body>
</html>
