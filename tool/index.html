<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شوف مشروعك على الشاشة - GoCode</title>
<link rel="icon" type="image/png" href="../assets/img/gocode.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --org:#F4762C; --red:#E8435A; --amber:#FBB040;
  --ink:#2A2320; --mut:#8A7B70; --bg:#FFF8F2; --card:#FFFFFF; --line:#F0E2D6;
  --grad:linear-gradient(135deg,#F4762C,#E8435A);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Cairo',sans-serif;color:var(--ink);min-height:100vh;padding-bottom:60px}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px}

header{text-align:center;padding:10px 0 4px}
header img{height:64px}
header h1{font-size:25px;font-weight:900;margin-top:6px}
header h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--mut);font-size:14.5px;font-weight:600;margin-top:2px}

.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-top:16px;box-shadow:0 4px 14px rgba(232,67,90,.05)}
.sec h2{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sec h2::before{content:'';width:10px;height:10px;border-radius:3px;background:var(--grad);flex:0 0 auto}
.sec .note{font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:8px}

label.fl{display:block;font-size:14.5px;font-weight:700;margin:14px 0 6px}
label.fl small{color:var(--mut);font-weight:600}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:16px;background:#FFFDFB;color:var(--ink);transition:border .2s}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--org)}
textarea{resize:vertical;min-height:74px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{border:1.5px solid var(--line);background:#FFFDFB;border-radius:100px;padding:9px 16px;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .18s;user-select:none}
.chips input:checked+label{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(232,67,90,.3)}
.chips.err label{border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(4px)}75%{transform:translateX(-4px)}}

#send{width:100%;margin-top:20px;background:var(--grad);color:#fff;border:none;border-radius:100px;padding:16px;font-family:inherit;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(232,67,90,.35);transition:transform .2s}
#send:active{transform:scale(.97)}
#send:disabled{opacity:.6}
#errmsg{display:none;text-align:center;color:var(--red);font-weight:700;font-size:14px;margin-top:10px}
#errmsg.on{display:block}

/* thank-you overlay */
#done{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:10}
#done.on{display:flex}
#done .box{max-width:380px}
#done .ok{width:96px;height:96px;border-radius:50%;background:var(--grad);color:#fff;font-size:48px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:popin .5s cubic-bezier(.2,.7,.3,1.4) both}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
#done h2{font-size:28px;font-weight:900}
#done p{font-size:18px;color:var(--mut);font-weight:700;margin-top:6px}
#done button{margin-top:26px;background:none;border:1.5px solid var(--line);border-radius:100px;padding:12px 28px;font-family:inherit;font-size:15px;font-weight:700;color:var(--mut);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../assets/img/gocode.png" alt="GoCode">
    <h1>شوف مشروعك <em>على الشاشة</em></h1>
    <p>دورة صناعة المحتوى بالذكاء الاصطناعي ✦ GoCode</p>
  </header>

  <form id="f" novalidate>

    <div class="sec">
      <h2>بياناتك</h2>
      <div class="note">الاسم خاص بالمدرب - لن يظهر على الشاشة</div>
      <label class="fl" for="name">الاسم</label>
      <input type="text" id="name" autocomplete="name" required>
    </div>

    <div class="sec">
      <h2>مشروعك</h2>
      <label class="fl" for="project">اسم المشروع / المنتج</label>
      <input type="text" id="project" required>

      <label class="fl">طبيعة المشروع</label>
      <div class="chips" data-k="ptype"></div>

      <label class="fl">مرحلة المشروع</label>
      <div class="chips" data-k="stage"></div>
    </div>

    <div class="sec">
      <h2>الجاهزية التسويقية</h2>
      <label class="fl">هل عندك شعار (لوقو)؟</label>
      <div class="chips" data-k="logo"></div>

      <label class="fl">هل عندك خطة تسويقية مبدئية؟</label>
      <div class="chips" data-k="plan"></div>

      <label class="fl">هل جربت أدوات AI بالتسويق من قبل؟</label>
      <div class="chips" data-k="ai"></div>
    </div>

    <div class="sec">
      <h2>جمهورك</h2>
      <label class="fl">الفئة العمرية المستهدفة</label>
      <div class="chips" data-k="age"></div>

      <label class="fl">طبيعة الجمهور</label>
      <div class="chips" data-k="aud"></div>

      <label class="fl">المنصة الأساسية لجمهورك</label>
      <div class="chips" data-k="platform"></div>

      <label class="fl" for="challenge">أكبر تحدي تسويقي تواجهه حالياً؟ <small>(اختياري)</small></label>
      <textarea id="challenge" maxlength="200"></textarea>
    </div>

    <button id="send" type="submit">إرسال 🚀</button>
    <div id="errmsg"></div>
  </form>
</div>

<div id="done">
  <div class="box">
    <div class="ok">✓</div>
    <h2>تم!</h2>
    <p>شوف الشاشة الكبيرة 👀</p>
    <button id="again">إرسال مشاركة أخرى</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const OPTS={
  ptype:['تجاري','شخصي','خدمي','منتج مادي','تقني - برمجي','أخرى'],
  stage:['فكرة فقط','بداية تشغيل','يعمل حالياً وأبي أطوّر تسويقه'],
  logo:['نعم','لا','قيد التصميم'],
  plan:['واضحة','أفكار متفرقة','لا شي إطلاقاً'],
  ai:['ما جربت','جربت بسيط','أستخدمها بشكل منتظم'],
  age:['15-20','20-30','30-45','45+','متنوعة'],
  aud:['أفراد (B2C)','شركات (B2B)'],
  platform:['إنستقرام','تيك توك','سناب شات','لينكدإن','واتساب','موقع إلكتروني']
};
document.querySelectorAll('.chips').forEach(box=>{
  const k=box.dataset.k;
  OPTS[k].forEach((o,i)=>{
    const id=k+'_'+i;
    box.insertAdjacentHTML('beforeend',
      `<input type="radio" name="${k}" id="${id}" value="${o}"><label for="${id}">${o}</label>`);
  });
});

const FS_URL=`https://firestore.googleapis.com/v1/projects/${CC_CONFIG.PROJECT_ID}/databases/(default)/documents/${CC_CONFIG.COLLECTION}?key=${CC_CONFIG.API_KEY}`;
const S=v=>({stringValue:v});
const form=document.getElementById('f'),send=document.getElementById('send'),errEl=document.getElementById('errmsg');

async function post(fields,tries){
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(FS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
      if(r.ok)return true;
    }catch(e){}
    await new Promise(res=>setTimeout(res,900*(i+1)));
  }
  return false;
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  errEl.classList.remove('on');
  let bad=null;
  const name=document.getElementById('name').value.trim();
  const project=document.getElementById('project').value.trim();
  if(!name)bad=document.getElementById('name');
  else if(!project)bad=document.getElementById('project');
  const picks={};
  document.querySelectorAll('.chips').forEach(box=>{
    box.classList.remove('err');
    const sel=box.querySelector('input:checked');
    if(!sel){if(!bad){bad=box;box.classList.add('err');}}
    else picks[box.dataset.k]=sel.value;
  });
  if(bad){
    errEl.textContent='كمّل الحقول الناقصة 🙏';errEl.classList.add('on');
    bad.scrollIntoView({behavior:'smooth',block:'center'});
    if(bad.focus)bad.focus();
    return;
  }
  send.disabled=true;send.textContent='جارٍ الإرسال…';
  const fields={
    session:S(CC_CONFIG.SESSION), name:S(name), project:S(project),
    ptype:S(picks.ptype), stage:S(picks.stage), logo:S(picks.logo),
    plan:S(picks.plan), ai:S(picks.ai), age:S(picks.age),
    aud:S(picks.aud), platform:S(picks.platform),
    challenge:S(document.getElementById('challenge').value.trim()),
    ts:S(new Date().toISOString())
  };
  const ok=await post(fields,3);
  send.disabled=false;send.textContent='إرسال 🚀';
  if(ok){
    document.getElementById('done').classList.add('on');
    window.scrollTo(0,0);
  }else{
    errEl.textContent='تعذّر الإرسال - تأكد من الإنترنت وحاول مرة ثانية';
    errEl.classList.add('on');
  }
});

document.getElementById('again').addEventListener('click',()=>{
  form.reset();
  document.getElementById('done').classList.remove('on');
  window.scrollTo(0,0);
});
</script>
</body>
</html>
