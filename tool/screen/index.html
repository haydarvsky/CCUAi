<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشاشة الحية - شوف مشروعك على الشاشة</title>
<link rel="icon" type="image/png" href="../../assets/img/haydar-logo.png">
<link rel="stylesheet" href="../../assets/css/theme.css">
<style>
html,body{overflow-x:clip}
body{min-height:100vh;padding:24px 32px 40px}

/* ornaments مثل السلايدات */
.orn{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.orn.o1{width:340px;height:340px;border:1.5px solid var(--line);top:-120px;left:-120px;opacity:.55}
.orn.o2{width:220px;height:220px;border:1.5px dashed var(--line);bottom:-70px;right:-70px;opacity:.5}
.orn.o3{width:14px;height:14px;background:var(--orange);opacity:.25;top:120px;right:140px}
.orn.o4{width:9px;height:9px;background:var(--green);opacity:.2;bottom:150px;left:180px}

header{display:flex;align-items:center;gap:20px;position:relative;z-index:1}
.logos{display:flex;align-items:center;gap:16px}
.logos img{height:56px;width:auto}
.logos .sep{width:6px;height:6px;border-radius:50%;background:var(--orange);opacity:.6}
header h1{font-size:32px;font-weight:800;color:var(--green)}
header h1 em{font-style:normal;color:var(--orange)}
header .sub{color:var(--muted);font-size:15px;font-weight:700}
.hd-left{margin-inline-start:auto;display:flex;align-items:center;gap:18px}
#wipe{background:none;border:1.5px solid var(--line);border-radius:100px;padding:8px 20px;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.2s}
#wipe:hover{border-color:#B4513E;color:#B4513E}
#wipe:disabled{opacity:.5;cursor:default}
#status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14.5px;font-weight:700}
#status .dot{width:10px;height:10px;border-radius:50%;background:#1E7A46;animation:blink 2s infinite}
#status.warn .dot{background:var(--orange)}
@keyframes blink{50%{opacity:.35}}

/* stats bar */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px;position:relative;z-index:1}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 22px;position:relative;overflow:hidden}
.st::after{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:var(--orange)}
.st .v{font-size:46px;font-weight:800;line-height:1.15;color:var(--green)}
.st .v.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.15)}}
.st .l{color:var(--muted);font-size:16px;font-weight:700;margin-top:2px}

/* main grid */
#main{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:16px;position:relative;z-index:1;align-items:start}

/* chart */
#chart{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px}
#chart h3{font-size:18px;font-weight:800;color:var(--green);margin-bottom:12px}
.bar{margin:11px 0}
.bar .bl{display:flex;justify-content:space-between;font-size:15.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.bar .bl b{color:var(--green)}
.bar .tr{height:14px;background:#EAE2D2;border-radius:10px;overflow:hidden}
.bar .fl{height:100%;border-radius:10px;background:var(--orange);width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)}

/* cards */
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;position:relative;overflow:hidden;animation:enter .6s cubic-bezier(.2,.7,.2,1) both}
.pc::before{content:'';position:absolute;top:0;bottom:0;right:0;width:4px;background:var(--orange)}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.pc .pn{font-size:22px;font-weight:800;color:var(--green);line-height:1.3}
.pc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pc .tg{background:var(--cream);border:1px solid var(--line);border-radius:100px;padding:3px 13px;font-size:13.5px;font-weight:700;color:var(--orange)}
.pc .aud{margin-top:10px;font-size:15.5px;font-weight:700;color:var(--body)}
.pc .flags{display:flex;gap:16px;margin-top:8px;font-size:14.5px;font-weight:700}
.pc .flags span{display:flex;align-items:center;gap:5px;color:var(--muted)}

#empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
#empty .qr-hint{font-size:30px;font-weight:800;color:var(--green)}
#empty p{font-size:18px;font-weight:700;margin-top:6px}
#empty .pulse{width:16px;height:16px;border-radius:50%;background:var(--orange);margin:24px auto 0;animation:pulse-ring 1.8s infinite}

@media (max-width:900px){
  #stats{grid-template-columns:1fr 1fr}
  #main{grid-template-columns:1fr}
  .st .v{font-size:36px}
  header h1{font-size:24px}
  .logos img{height:42px}
}
</style>
</head>
<body>
<div class="orn o1"></div><div class="orn o2"></div><div class="orn o3"></div><div class="orn o4"></div>

<header>
  <div class="logos">
    <img src="../../assets/img/haydar-logo.png" alt="حيدر المعاتيق">
    <div class="sep"></div>
    <img src="../../assets/img/gocode.png" alt="GoCode">
  </div>
  <div>
    <h1>شوف مشروعك <em>على الشاشة</em></h1>
    <div class="sub">دورة صناعة المحتوى بالذكاء الاصطناعي ✦ GoCode</div>
  </div>
  <div class="hd-left">
    <button id="wipe" title="حذف كل مشاركات هذه الجلسة">🗑 تصفير النتائج</button>
    <div id="status"><span class="dot"></span><span id="stxt">مباشر</span></div>
  </div>
</header>

<div id="stats">
  <div class="st"><div class="v" id="s-count">٠</div><div class="l">مشارك مسجَّل</div></div>
  <div class="st"><div class="v" id="s-logo">-</div><div class="l">عندهم شعار جاهز</div></div>
  <div class="st"><div class="v" id="s-plan">-</div><div class="l">عندهم خطة تسويقية واضحة</div></div>
  <div class="st"><div class="v" id="s-plat">-</div><div class="l">المنصة الأكثر تكراراً</div></div>
</div>

<div id="main">
  <div id="chart">
    <h3>توزيع طبيعة المشاريع</h3>
    <div id="bars"></div>
  </div>
  <div id="cards">
    <div id="empty">
      <div class="qr-hint">📱 امسح الـ QR وسجّل مشروعك</div>
      <p>البطاقات راح تظهر هنا لحظة بلحظة…</p>
      <div class="pulse"></div>
    </div>
  </div>
</div>

<script src="../config.js"></script>
<script>
const DEMO=new URLSearchParams(location.search).has('demo');
const SESSION=new URLSearchParams(location.search).get('s')||CC_CONFIG.SESSION;
const PTYPES=['تجاري','شخصي','خدمي','منتج مادي','تقني - برمجي','أخرى'];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

let all=[];

function render(){
  const n=all.length;
  const set=(id,val)=>{
    const el=document.getElementById(id);
    if(el.textContent!==val){el.textContent=val;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
  };
  set('s-count',AR(n));
  if(n){
    set('s-logo',AR(Math.round(100*all.filter(p=>p.logo==='نعم').length/n))+'٪');
    set('s-plan',AR(Math.round(100*all.filter(p=>p.plan==='واضحة').length/n))+'٪');
    const pc={};all.forEach(p=>pc[p.platform]=(pc[p.platform]||0)+1);
    set('s-plat',Object.entries(pc).sort((a,b)=>b[1]-a[1])[0][0]);
  }
  // chart
  const tc={};all.forEach(p=>tc[p.ptype]=(tc[p.ptype]||0)+1);
  const max=Math.max(1,...Object.values(tc));
  const bars=document.getElementById('bars');
  PTYPES.forEach(t=>{
    let b=bars.querySelector(`[data-t="${t}"]`);
    if(!b){
      b=document.createElement('div');b.className='bar';b.dataset.t=t;
      b.innerHTML=`<div class="bl"><span>${t}</span><b>٠</b></div><div class="tr"><div class="fl"></div></div>`;
      bars.appendChild(b);
    }
    const c=tc[t]||0;
    b.querySelector('b').textContent=AR(c);
    b.querySelector('.fl').style.width=(c/max*100)+'%';
  });
  // cards
  const cards=document.getElementById('cards');
  const empty=document.getElementById('empty');
  if(n)empty.style.display='none';
  all.forEach(p=>{
    if(cards.querySelector(`[data-id="${p.id}"]`))return;
    const el=document.createElement('div');
    el.className='pc';el.dataset.id=p.id;
    const ok=v=>v?'✅':'❌';
    el.innerHTML=`
      <div class="pn">${esc(p.project)}</div>
      <div class="tags"><span class="tg">${esc(p.ptype)}</span><span class="tg">${esc(p.stage)}</span></div>
      <div class="aud">🎯 ${esc(p.age)} ✦ ${esc(p.platform)}</div>
      <div class="flags">
        <span>${ok(p.logo==='نعم')} شعار</span>
        <span>${ok(p.plan==='واضحة')} خطة تسويقية</span>
      </div>`;
    cards.prepend(el);
  });
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* ---- live polling ---- */
const RQ_URL=`https://firestore.googleapis.com/v1/projects/${CC_CONFIG.PROJECT_ID}/databases/(default)/documents:runQuery?key=${CC_CONFIG.API_KEY}`;
let failures=0;
async function poll(){
  try{
    const r=await fetch(RQ_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({structuredQuery:{
        from:[{collectionId:CC_CONFIG.COLLECTION}],
        where:{fieldFilter:{field:{fieldPath:'session'},op:'EQUAL',value:{stringValue:SESSION}}},
        limit:300
      }})});
    if(!r.ok)throw 0;
    const rows=await r.json();
    const list=[];
    rows.forEach(x=>{
      if(!x.document)return;
      const f=x.document.fields||{};
      const g=k=>f[k]?f[k].stringValue:'';
      const id=x.document.name.split('/').pop();
      list.push({id,project:g('project'),ptype:g('ptype'),stage:g('stage'),logo:g('logo'),
                 plan:g('plan'),age:g('age'),platform:g('platform'),ts:g('ts')});
    });
    list.sort((a,b)=>a.ts<b.ts?-1:1);
    all=list;
    failures=0;
    document.getElementById('status').classList.remove('warn');
    document.getElementById('stxt').textContent='مباشر';
    render();
  }catch(e){
    failures++;
    if(failures>=2){
      document.getElementById('status').classList.add('warn');
      document.getElementById('stxt').textContent='يعيد الاتصال…';
    }
  }
}

/* ---- demo mode: بيانات تجريبية تظهر تدريجياً (?demo) ---- */
const FAKE=[
  ['متجر بُنّ الديرة','تجاري','يعمل حالياً وأبي أطوّر تسويقه','نعم','أفكار متفرقة','20-30','إنستقرام'],
  ['عيادة نبض','خدمي','بداية تشغيل','نعم','واضحة','30-45','إنستقرام'],
  ['تطبيق مشوار','تقني - برمجي','فكرة فقط','لا','لا شي إطلاقاً','20-30','تيك توك'],
  ['حلويات دانة','منتج مادي','يعمل حالياً وأبي أطوّر تسويقه','قيد التصميم','أفكار متفرقة','متنوعة','سناب شات'],
  ['أكاديمية قمم','خدمي','بداية تشغيل','نعم','واضحة','30-45','لينكدإن'],
  ['بودكاست همس','شخصي','فكرة فقط','لا','لا شي إطلاقاً','20-30','تيك توك'],
  ['عطور ريف','تجاري','يعمل حالياً وأبي أطوّر تسويقه','نعم','أفكار متفرقة','20-30','إنستقرام'],
  ['ورشة إبداع الطفل','خدمي','بداية تشغيل','قيد التصميم','لا شي إطلاقاً','30-45','واتساب'],
  ['منصة رزنامة','تقني - برمجي','فكرة فقط','لا','أفكار متفرقة','20-30','موقع إلكتروني'],
  ['مطبخ أم نواف','منتج مادي','يعمل حالياً وأبي أطوّر تسويقه','لا','لا شي إطلاقاً','متنوعة','واتساب'],
  ['استشارات نمو','خدمي','يعمل حالياً وأبي أطوّر تسويقه','نعم','واضحة','45+','لينكدإن'],
  ['قهوة مختصة كيف','تجاري','بداية تشغيل','نعم','أفكار متفرقة','20-30','إنستقرام']
];
function demo(){
  let i=0;
  const step=()=>{
    if(i>=FAKE.length||demoStopped)return;
    const [project,ptype,stage,logo,plan,age,platform]=FAKE[i];
    all.push({id:'demo'+i,project,ptype,stage,logo,plan,age,platform,ts:String(i)});
    i++;render();
    setTimeout(step,i<3?1200:2600);
  };
  step();
}

/* ---- تصفير النتائج ---- */
let wiping=false,demoStopped=false;
function resetUI(){
  all=[];
  document.querySelectorAll('.pc').forEach(el=>el.remove());
  document.getElementById('empty').style.display='';
  ['s-count','s-logo','s-plan','s-plat'].forEach((id,i)=>{
    document.getElementById(id).textContent=i===0?'٠':'-';
  });
  document.querySelectorAll('#bars .bar').forEach(b=>{
    b.querySelector('b').textContent='٠';
    b.querySelector('.fl').style.width='0%';
  });
}
document.getElementById('wipe').addEventListener('click',async()=>{
  if(!confirm('متأكد؟ راح تنحذف كل مشاركات هذه الجلسة نهائياً'))return;
  const btn=document.getElementById('wipe');
  btn.disabled=true;btn.textContent='جارٍ المسح…';
  if(DEMO){demoStopped=true;resetUI();}
  else{
    wiping=true;
    try{
      const r=await fetch(RQ_URL,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({structuredQuery:{
          from:[{collectionId:CC_CONFIG.COLLECTION}],
          where:{fieldFilter:{field:{fieldPath:'session'},op:'EQUAL',value:{stringValue:SESSION}}},
          limit:300
        }})});
      const rows=await r.json();
      for(const x of rows){
        if(!x.document)continue;
        await fetch(`https://firestore.googleapis.com/v1/${x.document.name}?key=${CC_CONFIG.API_KEY}`,{method:'DELETE'});
      }
      resetUI();
    }catch(e){alert('تعذّر المسح - تأكد من الإنترنت وحاول مرة ثانية');}
    wiping=false;
  }
  btn.disabled=false;btn.textContent='🗑 تصفير النتائج';
});

if(DEMO){document.getElementById('stxt').textContent='وضع تجريبي';demo();}
else{poll();setInterval(()=>{if(!wiping)poll();},4000);}
</script>
</body>
</html>
