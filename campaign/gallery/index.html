<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرض الحملات - صناعة المحتوى بالذكاء الاصطناعي</title>
<link rel="icon" type="image/png" href="../../assets/img/haydar-logo.png">
<link rel="stylesheet" href="../../assets/css/theme.css">
<style>
html,body{overflow-x:clip}
body{min-height:100vh;padding:22px 30px 46px}

.orn{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.orn.o1{width:340px;height:340px;border:1.5px solid var(--line);top:-120px;left:-120px;opacity:.55}
.orn.o2{width:220px;height:220px;border:1.5px dashed var(--line);bottom:-70px;right:-70px;opacity:.5}
.orn.o3{width:14px;height:14px;background:var(--orange);opacity:.25;top:120px;right:140px;animation:floaty 5s ease-in-out infinite}

header{display:flex;align-items:center;gap:18px;position:relative;z-index:1;flex-wrap:wrap}
.logos{display:flex;align-items:center;gap:14px}
.logos img{height:52px;width:auto}
.logos .sep{width:6px;height:6px;border-radius:50%;background:var(--orange);opacity:.6}
header h1{font-size:30px;font-weight:800;color:var(--green)}
header h1 em{font-style:normal;color:var(--orange)}
header .sub{color:var(--muted);font-size:14.5px;font-weight:700}
.hd-left{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
#wipe{background:none;border:1.5px solid var(--line);border-radius:100px;padding:7px 18px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.2s}
#wipe:hover{border-color:#B4513E;color:#B4513E}
#status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:700}
#status .dot{width:10px;height:10px;border-radius:50%;background:#1E7A46;animation:blink 2s infinite}
#status.warn .dot{background:var(--orange)}
@keyframes blink{50%{opacity:.35}}

#topbar{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.tb{background:var(--card);border:1px solid var(--line);border-radius:100px;padding:10px 28px;font-size:18px;font-weight:800;color:var(--green);display:flex;align-items:center;gap:10px}
.tb b{font-size:26px;color:var(--orange)}

#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:18px;position:relative;z-index:1}
.cc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;position:relative;overflow:hidden;animation:enter .7s cubic-bezier(.2,.8,.25,1.1) both;display:flex;flex-direction:column}
.cc::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:var(--orange)}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.cc.leader{border-color:var(--orange);box-shadow:0 0 0 3px rgba(217,119,6,.18),0 16px 34px rgba(217,119,6,.14)}
.cc .crown{position:absolute;top:12px;left:14px;font-size:26px;display:none;animation:floaty 3s ease-in-out infinite}
.cc.leader .crown{display:block}
.cc .msg{font-size:23px;font-weight:800;color:var(--green);line-height:1.45}
.cc .msg::before{content:'❝';color:var(--orange);margin-left:6px}
.cc .prj{font-size:15px;color:var(--muted);font-weight:700;margin-top:4px}
.cc .pieces{display:flex;flex-direction:column;gap:7px;margin-top:12px;flex:1}
.cc .pi{display:flex;gap:9px;align-items:baseline;font-size:15px;color:var(--body);line-height:1.55}
.cc .pi .pf{flex:0 0 auto;background:var(--cream);border:1px solid var(--line);border-radius:100px;padding:2px 12px;font-size:12.5px;font-weight:700;color:var(--orange);white-space:nowrap}
.cc .likerow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.cc .lk{border:none;background:var(--cream);border:1.5px solid var(--line);border-radius:100px;padding:8px 22px;font-family:inherit;font-size:16px;font-weight:800;color:#B4513E;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:8px}
.cc .lk:hover{border-color:#B4513E}
.cc .lk:disabled{opacity:.6;cursor:default}
.cc .lk.liked{background:#B4513E;border-color:#B4513E;color:#fff}
.cc .cnt{font-size:26px;font-weight:800;color:var(--green);display:flex;align-items:center;gap:7px}
.cc .cnt.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

#empty{text-align:center;padding:80px 20px;color:var(--muted);position:relative;z-index:1}
#empty .t{font-size:30px;font-weight:800;color:var(--green)}
#empty p{font-size:17px;font-weight:700;margin-top:6px}
#empty .pulse{width:16px;height:16px;border-radius:50%;background:var(--orange);margin:24px auto 0;animation:pulse-ring 1.8s infinite}

/* قلوب طائرة */
.fh{position:fixed;bottom:-40px;font-size:30px;z-index:70;pointer-events:none;animation:fly var(--dur) ease-in forwards}
@keyframes fly{0%{transform:translateY(0) scale(.7);opacity:1}100%{transform:translateY(-110vh) translateX(var(--dx)) scale(1.3);opacity:0}}

@media (max-width:700px){
  header h1{font-size:23px}
  .logos img{height:40px}
  #cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="orn o1"></div><div class="orn o2"></div><div class="orn o3"></div>

<header>
  <div class="logos">
    <img src="../../assets/img/haydar-logo.png" alt="حيدر المعاتيق">
    <div class="sep"></div>
    <img src="../../assets/img/gocode.png" alt="GoCode">
  </div>
  <div>
    <h1>معرض <em>الحملات</em> ❤️</h1>
    <div class="sub">صوّتوا بالقلوب لأكثر حملة ألهمتكم ✦ اليوم الثالث</div>
  </div>
  <div class="hd-left">
    <button id="wipe" title="حذف كل الحملات والإعجابات">🗑 تصفير</button>
    <div id="status"><span class="dot"></span><span id="stxt">مباشر</span></div>
  </div>
</header>

<div id="topbar">
  <div class="tb">📣 حملة <b id="t-count">٠</b></div>
  <div class="tb">❤️ إعجاب <b id="t-likes">٠</b></div>
</div>

<div id="empty">
  <div class="t">📱 أرسلوا حملاتكم… والمعرض يفتح أبوابه</div>
  <p>كل حملة تظهر هنا لحظة وصولها</p>
  <div class="pulse"></div>
</div>

<div id="cards"></div>

<script src="../config.js"></script>
<script>
const DEMO=new URLSearchParams(location.search).has('demo');
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let dev=localStorage.getItem('cc-dev');
if(!dev){dev=Math.random().toString(36).slice(2,10);localStorage.setItem('cc-dev',dev);}
const likedSet=new Set(JSON.parse(localStorage.getItem('cc-d3-liked')||'[]'));

let camps=[],likes={},prevTotal=0;

function hearts(n){
  for(let i=0;i<n;i++){
    const h=document.createElement('div');
    h.className='fh';
    h.textContent=['❤️','🧡','💛','💚'][Math.random()*4|0];
    h.style.cssText=`right:${10+Math.random()*80}vw;--dur:${1.8+Math.random()*1.4}s;--dx:${(Math.random()<.5?-1:1)*(20+Math.random()*60)}px`;
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3400);
  }
}

function render(){
  const cards=document.getElementById('cards');
  const empty=document.getElementById('empty');
  if(camps.length)empty.style.display='none';else empty.style.display='';
  document.getElementById('t-count').textContent=AR(camps.length);
  const totalLikes=Object.values(likes).reduce((a,b)=>a+b,0);
  document.getElementById('t-likes').textContent=AR(totalLikes);
  if(totalLikes>prevTotal)hearts(Math.min(8,totalLikes-prevTotal)*2);
  prevTotal=totalLikes;

  let maxL=0;camps.forEach(c=>{maxL=Math.max(maxL,likes[c.id]||0);});
  camps.forEach(c=>{
    let el=cards.querySelector(`[data-id="${c.id}"]`);
    if(!el){
      el=document.createElement('div');
      el.className='cc';el.dataset.id=c.id;
      el.innerHTML=`
        <span class="crown">👑</span>
        <div class="msg">${esc(c.message)}</div>
        <div class="prj">${esc(c.project)}</div>
        <div class="pieces">
          <div class="pi"><span class="pf">${esc(c.pf1)}</span><span>${esc(c.pd1)}</span></div>
          <div class="pi"><span class="pf">${esc(c.pf2)}</span><span>${esc(c.pd2)}</span></div>
          <div class="pi"><span class="pf">${esc(c.pf3)}</span><span>${esc(c.pd3)}</span></div>
        </div>
        <div class="likerow">
          <button class="lk">❤️ أعجبتني</button>
          <div class="cnt">❤️ <span>٠</span></div>
        </div>`;
      const btn=el.querySelector('.lk');
      if(likedSet.has(c.id)){btn.disabled=true;btn.classList.add('liked');btn.textContent='❤️ صوّتت';}
      btn.addEventListener('click',async()=>{
        if(likedSet.has(c.id))return;
        btn.disabled=true;
        const ok=DEMO?true:await likeCampaign(c.id);
        if(ok){
          likedSet.add(c.id);
          localStorage.setItem('cc-d3-liked',JSON.stringify([...likedSet]));
          btn.classList.add('liked');btn.textContent='❤️ صوّتت';
          likes[c.id]=(likes[c.id]||0)+1;
          hearts(4);render();
        }else btn.disabled=false;
      });
      cards.prepend(el);
    }
    const n=likes[c.id]||0;
    const cntEl=el.querySelector('.cnt span');
    if(cntEl.textContent!==AR(n)){cntEl.textContent=AR(n);const cn=el.querySelector('.cnt');cn.classList.remove('bump');void cn.offsetWidth;cn.classList.add('bump');}
    el.classList.toggle('leader',n>0&&n===maxL);
  });
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

let failures=0;
async function poll(){
  try{
    const [rc,rl]=await Promise.all([
      fetch(C_RQ_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sessionQuery(C_CONFIG.SESSION))}),
      fetch(C_RQ_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sessionQuery(C_CONFIG.LIKES_SESSION))})
    ]);
    if(!rc.ok||!rl.ok)throw 0;
    const rows=await rc.json(),lrows=await rl.json();
    const list=[];
    rows.forEach(x=>{
      if(!x.document)return;
      const f=x.document.fields||{},g=k=>f[k]?f[k].stringValue:'';
      list.push({id:x.document.name.split('/').pop(),project:g('project'),message:g('message'),
        pf1:g('pf1'),pd1:g('pd1'),pf2:g('pf2'),pd2:g('pd2'),pf3:g('pf3'),pd3:g('pd3'),ts:g('ts')});
    });
    list.sort((a,b)=>a.ts<b.ts?-1:1);
    camps=list;
    const lk={};
    lrows.forEach(x=>{
      if(!x.document)return;
      const id=x.document.name.split('/').pop().replace(/^like-/,'');
      lk[id]=parseInt(x.document.fields?.n?.integerValue||'0');
    });
    likes=lk;
    failures=0;
    document.getElementById('status').classList.remove('warn');
    document.getElementById('stxt').textContent='مباشر';
    render();
  }catch(e){
    failures++;
    if(failures>=2){
      document.getElementById('status').classList.add('warn');
      document.getElementById('stxt').textContent='يعيد الاتصال…';
    }
  }
}

/* وضع تجريبي */
const FAKE=[
  ['بُنّ الديرة','قهوتك تشبهك','ريل إنستقرام','رحلة الحبة من المحمصة لبيتك','ستوري','استفتاء: كم فنجان بيومك؟','بوست إنستقرام','اقتباس ساخر عن صباحات الدوام'],
  ['عطور ريف','رائحتك… توقيعك','تيك توك','تحدي خمّن العطر من الوصف','ريل إنستقرام','قصة عميلة اختارت عطر زفافها','ستوري','سؤال: عطرك الصيفي أو الشتوي؟'],
  ['أكاديمية قمم','مهارة واحدة كل شهر','لينكدإن','مقال قصير: مهارات ٢٠٢٦','بوست إنستقرام','إنفوجرافيك خطوات التعلم','واتساب','رسالة أسبوعية بنصيحة عملية'],
  ['حلويات دانة','حلا البيت… بيد أهله','سناب شات','كواليس تجهيز طلبية العيد','ريل إنستقرام','وصفة سريعة بمكونين','ستوري','تصويت: كنافة أو بسبوسة؟'],
  ['عيادة نبض','صحتك قرار يومي','بوست إنستقرام','خرافة طبية نصححها كل أحد','ريل إنستقرام','دقيقة مع الطبيب','لينكدإن','مقال توعوي للشركات']
];
let demoStopped=false;
function demo(){
  document.getElementById('stxt').textContent='وضع تجريبي';
  let i=0;
  const step=()=>{
    if(i>=FAKE.length||demoStopped)return;
    const [project,message,pf1,pd1,pf2,pd2,pf3,pd3]=FAKE[i];
    camps.push({id:'demo'+i,project,message,pf1,pd1,pf2,pd2,pf3,pd3,ts:String(i)});
    i++;render();
    if(i>1){const id='demo'+(Math.random()*i|0);likes[id]=(likes[id]||0)+1;render();}
    setTimeout(step,i<2?700:2300);
  };
  step();
  setInterval(()=>{
    if(demoStopped||!camps.length)return;
    const id='demo'+(Math.random()*camps.length|0);
    likes[id]=(likes[id]||0)+1;render();
  },2800);
}

/* تصفير */
document.getElementById('wipe').addEventListener('click',async()=>{
  if(!confirm('متأكد؟ راح تنحذف كل الحملات والإعجابات نهائياً'))return;
  const btn=document.getElementById('wipe');
  btn.disabled=true;btn.textContent='جارٍ المسح…';
  if(DEMO){demoStopped=true;camps=[];likes={};prevTotal=0;document.querySelectorAll('.cc').forEach(e=>e.remove());render();}
  else{
    try{
      for(const sess of [C_CONFIG.SESSION,C_CONFIG.LIKES_SESSION]){
        const r=await fetch(C_RQ_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sessionQuery(sess))});
        const rows=await r.json();
        for(const x of rows){
          if(!x.document)continue;
          await fetch(`https://firestore.googleapis.com/v1/${x.document.name}?key=${C_CONFIG.API_KEY}`,{method:'DELETE'});
        }
      }
      camps=[];likes={};prevTotal=0;
      document.querySelectorAll('.cc').forEach(e=>e.remove());
      render();
    }catch(e){alert('تعذّر المسح - حاول مرة ثانية');}
  }
  btn.disabled=false;btn.textContent='🗑 تصفير';
});

if(DEMO)demo();
else{poll();setInterval(poll,4000);}
</script>
</body>
</html>
